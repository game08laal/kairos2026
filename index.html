<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAIRÓS - Sistema de Monitoramento</title>

    <link rel="stylesheet" href="css/inicio.css">
</head>

<body>

    <main class="tela-inicial">

        <header class="cabecalho-inicial">

            <img
                src="assets/logo.png"
                alt="Logo KAIRÓS"
                class="logo"
            >

            <div class="identificacao-sistema">
                <h1>KAIRÓS</h1>
                <p>Sistema de Monitoramento Laboratorial</p>
            </div>

        </header>


        <section class="conteudo-inicial">

            <div class="icone-sistema">
                <span>✦</span>
            </div>

            <p class="status-sistema">
                SISTEMA PRONTO
            </p>

            <h2>
                Bem-vindo ao sistema KAIRÓS
            </h2>

            <p class="descricao">
                Identifique-se para acessar o ambiente
                de monitoramento laboratorial.
            </p>

            <button
                id="btn-identificar"
                class="btn-identificar"
                onclick="window.location.href='reconhecimento.html'">

                IDENTIFICAR OPERADOR

            </button>

        </section>


        <footer class="rodape-inicial">

            <span>
                Sistema de Monitoramento Laboratorial
            </span>

            <span>
                •
            </span>

            <span>
                KAIRÓS
            </span>

        </footer>

    </main>

</body>

</html>
