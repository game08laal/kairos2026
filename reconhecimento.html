<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAIROS - Reconhecimento Facial</title>

    <link rel="stylesheet" href="css/reconhecimento.css">
</head>

<body>

    <div class="tela-reconhecimento">

        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <img
                src="assets/logo.png"
                alt="Logo KAIROS"
            >

            <div>
                <h1>Sistema KAIROS</h1>
                <p>Identificação do operador</p>
            </div>

        </header>


        <!-- CONTEÚDO PRINCIPAL -->
        <main class="cartao-reconhecimento">

            <div class="titulo-area">

                <h2>Reconhecimento facial</h2>

                <p>
                    Posicione seu rosto dentro da moldura
                    para realizar a identificação.
                </p>

            </div>


            <!-- ÁREA DA CÂMERA -->
            <div class="camera-area">

                <video
                    id="camera-rosto"
                    autoplay
                    muted
                    playsinline
                ></video>

                <!-- Moldura visual para posicionamento do rosto -->
                <div class="moldura-rosto"></div>

            </div>


            <!-- STATUS DO RECONHECIMENTO -->
            <div
                id="status-reconhecimento"
                class="status aguardando"
            >
                Iniciando reconhecimento facial...
            </div>


            <!-- MENSAGEM DO SISTEMA -->
            <p
                id="mensagem"
                class="mensagem"
            ></p>


            <!-- OPERADOR RECONHECIDO -->
            <div
                id="operador-reconhecido"
                class="operador oculto"
            >

                <span>Operador reconhecido</span>

                <strong id="nome-operador">
                    —
                </strong>

            </div>


            <!-- BOTÃO PARA CONTINUAR -->
            <button
                id="btn-continuar"
                class="btn-continuar oculto"
                type="button"
            >
                Continuar
            </button>

        </main>


        <!-- RODAPÉ -->
        <footer>
            KAIROS — Monitoramento Laboratorial
        </footer>

    </div>


    <!--
        ONNX Runtime
        Necessário para executar os modelos
        YuNet e SFace diretamente no navegador.
    -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>


    <!--
        Código responsável pelo reconhecimento facial.
    -->
    <script src="js/reconhecimento.js"></script>

</body>

</html>
